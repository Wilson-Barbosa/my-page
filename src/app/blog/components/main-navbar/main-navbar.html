<nav class="flex items-center justify-between px-2 py-1 sm:px-5 sm:py-2 md:py-4 text-white">

    <div class="flex gap-2 items-center justify-center">
        <img class="w-7 h-auto mb-1" src="images/logo.png" alt="">
        <p class="text-(--secondary-darker) font-semibold">Blog</p>
    </div>

    <ul class="hidden md:flex gap-4 text-sm items-center">
        <li><a routerLinkActive="active-navbar-item" routerLink="home" class="hover:border-b-(--secondary-darker) hover:border-b-2 py-2 px-3">Home</a></li>
        <li><a routerLinkActive="active-navbar-item" routerLink="/blog/posts" class="hover:border-b-(--secondary-darker) hover:border-b-2 py-2 px-3">Posts</a></li>
        <li><a routerLinkActive="active-navbar-item" routerLink="/portfolio" class="hover:border-b-(--secondary-darker) hover:border-b-2 py-2 px-3">Portfolio</a></li>
        <li [ngClass]="{'ring-2 ring-(--secondary-font-color)': showFocusEffect}" class="bg-(--secondary-background-color) rounded px-4 py-2">
            <input
                type="text"
                class="placeholder-(--secondary-font-color) w-65 text-(--primary-font-color) outline-none focus:ring-0 placeholder:italic"
                placeholder="search in posts"
                [(ngModel)]="searchKeywordInput"
                (focus)="handleOnInputFocus()"
                (blur)="handleOnInputBlur()"
                (keydown.enter)="redirectSearch()">
            <i class="bi bi-search"></i>
        </li>
    </ul>

    <!-- collapse menu icon -->
    <i class="md:hidden bi bi-list text-white py-1 px-2 transition-all duration-300"
        [ngClass]="{'-rotate-90': isNavbarCollapsed}" (click)="toggleNavBarCollapsed()"></i>


</nav>

<!-- mobile nav bar -->
<ul class="text-sm flex flex-col items-center md:hidden bg-(--primary) text-white w-full absolute top-10 sm:top-12 left-0 transition-all duration-300 z-2"
    [ngClass]="{
        'max-h-0 opacity-0 pointer-events-none': !isNavbarCollapsed,
        'max-h-96 opacity-100 pointer-events-auto': isNavbarCollapsed
    }">
    <li class="p-3">
        <a routerLinkActive="active-navbar-item" routerLink="home" (click)="toggleNavBarCollapsed()">Home</a>
    </li>
    <li class="p-3">
        <a routerLinkActive="active-navbar-item" routerLink="posts" (click)="toggleNavBarCollapsed()">Posts</a>
    </li>
    <li class="p-3">
        <a routerLinkActive="active-navbar-item" routerLink="/portfolio" (click)="toggleNavBarCollapsed()">Portfolio</a>
    </li>
</ul>
