<div class="md:mx-15 lg:mx-30">
    <app-header [size]="3" label="Search for a post" class="text-(--primary-font-color)"></app-header>

    <form [formGroup]="searchFormGroup" class="my-6 sm:flex items-center gap-3" (ngSubmit)="handleOnButtonClick(); $event.preventDefault()">
        <div
            class="bg-(--secondary-background-color) rounded flex items-center relative"
            [ngClass]="{'ring-2 ring-(--secondary-font-color)': showFocusEffect}">

            <i class="bi bi-search px-3 text-(--secondary-font-color)"></i>
            <input
                type="text"
                formControlName="postInputForm"
                class="placeholder-(--secondary-font-color) w-80 text-(--primary-font-color) outline-none focus:ring-0 placeholder:italic py-1.5 pr-3 rounded"
                placeholder="search in posts"
                (focus)="handleOnInputFocus()"
                (blur)="handleOnInputBlur()">

            @if(searchFormGroup.invalid && searchWasCalled){
                <p class="text-red-600 text-xs md:text-sm absolute top-22 sm:top-10">Minimum of 3 characters</p>
            }
        </div>


        <button type="submit"
            class="flex-none bg-(--primary-darker) text-white rounded h-full py-1.5 px-2.5 w-full sm:size-fit mt-2 sm:mt-0 hover:cursor-pointer"
            >Search</button>
    </form>


</div>


@if(displaySearchResults) {
<div class="md:mx-15 lg:mx-30 mt-9 md:mt-15">

    <app-header [size]="5" label="Results: " class="text-(--primary-font-color)"></app-header>

    @if (blogPostList.length === 0) {
        <app-p-text class="text-(--secondary-font-color)">
            <i class="bi bi-exclamation-circle"></i>
            <span class="italic ml-2">No posts found</span>
        </app-p-text>
    } @else {
        <app-p-text class="text-(--primary-font-color)">Found {{blogPostList.length}} results</app-p-text>
    }

    @for (post of blogPostList; track $index) {
        <a [routerLink]="[post.id]">
            <app-card extraClasses="p-3 sm:p-6 text-(--primary-font-color) my-6">
                <p class="header-5">{{post.title}}</p>
                <p class="p-text" [innerHTML]="post.body | fromHtmlToHighlightedString:highlightedSection "></p>
            </app-card>
        </a>
    }

</div>
}
